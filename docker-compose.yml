
services:
  mysql:
    image: mysql:8.4
    container_name: student_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_app
      MYSQL_PASSWORD: student_dev_password
    ports:
      - "3306:3306"
    volumes:
      - student_mysql_data:/var/lib/mysql

volumes:
  student_mysql_data:
